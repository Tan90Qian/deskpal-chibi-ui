name: Sync Upstream DeskPal

on:
  schedule:
    # Check upstream DeskPal every 6 hours (UTC)
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      test_feishu:
        description: "Send a test Feishu card and exit (verify webhook/secret)"
        type: boolean
        default: false
      force:
        description: "Force sync & notify even if an open PR already covers this upstream commit"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Test Feishu Notification Only
        if: ${{ inputs.test_feishu == true }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          node scripts/notify-feishu.mjs \
            --status ready \
            --title "DeskPal 皮肤同步机器人联通测试成功" \
            --body "GitHub Actions 已成功连接你的飞书机器人！\n\n- 仓库：\`${{ github.repository }}\`\n- 后续当上游 \`HuLuShiLei/DeskPal\` 的前端有更新时，将自动三方合并并在此处发送卡片提醒。" \
            --url "https://github.com/${{ github.repository }}/actions" \
            --button "查看 Actions"

      - name: Check & 3-Way Merge Upstream DeskPal Web
        if: ${{ inputs.test_feishu != true }}
        id: sync
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          node scripts/sync-upstream.mjs $ARGS

      - name: Deduplicate — Skip if Open PR Already Covers This Upstream Commit
        if: ${{ inputs.test_feishu != true && steps.sync.outputs.has_changes == 'true' }}
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_WEB_COMMIT: ${{ steps.sync.outputs.new_web_commit }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if any open upstream-sync PR already recorded this exact upstreamWebCommit
          EXISTING_URL=$(gh pr list --state open --label "upstream-sync" --json url,body --jq ".[] | select((.body // \"\") | contains(\"<!-- upstream-web-commit: ${NEW_WEB_COMMIT} -->\")) | .url" | head -n 1 || true)
          if [ -n "$EXISTING_URL" ]; then
            echo "Open PR already covers upstreamWebCommit ${NEW_WEB_COMMIT}: ${EXISTING_URL}"
            echo "Skipping duplicate build, push, and Feishu notification."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr=$EXISTING_URL" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies & Run Build Gate
        if: ${{ inputs.test_feishu != true && steps.sync.outputs.has_changes == 'true' && steps.dedup.outputs.skip != 'true' }}
        id: build
        run: |
          npm ci --no-fund --no-audit
          set +e
          npm run build > .sync-tmp/build.log 2>&1
          CODE=$?
          set -e
          cat .sync-tmp/build.log
          if [ $CODE -eq 0 ]; then
            echo "build_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Label & Push Sync Branch
        if: ${{ inputs.test_feishu != true && steps.sync.outputs.has_changes == 'true' && steps.dedup.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch_name }}
          NEW_TAG: ${{ steps.sync.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
          else
            git commit -m "chore(sync): sync upstream DeskPal $NEW_TAG"
          fi
          git push --force-with-lease -u origin "$BRANCH"

          gh label create "upstream-sync" --color "0E8A16" --description "Automated upstream DeskPal web sync" --force || true

      - name: Case A — Open Ready-to-Merge PR & Notify Feishu (Green)
        if: ${{ inputs.test_feishu != true && steps.sync.outputs.has_changes == 'true' && steps.dedup.outputs.skip != 'true' && steps.sync.outputs.conflict_count == '0' && steps.build.outputs.build_ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch_name }}
          NEW_TAG: ${{ steps.sync.outputs.new_tag }}
          NEW_WEB_COMMIT: ${{ steps.sync.outputs.new_web_commit }}
          COMPAT_VER: ${{ steps.sync.outputs.compatible_version }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          {
            cat .sync-tmp/sync-report.md
            echo ""
            echo "### 构建验证"
            echo "- \`tsc --noEmit && vite build\`：**通过** ✅"
            echo "- 合并本 PR 到 \`main\` 后，\`Release\` 工作流会自动按兼容版本 \`$COMPAT_VER\` 打 tag 并发布新版 Windows 安装包。"
            echo ""
            echo "<!-- upstream-web-commit: $NEW_WEB_COMMIT -->"
          } > .sync-tmp/pr-body.md

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "sync: 适配 DeskPal 上游更新 ($NEW_TAG)" \
              --body-file .sync-tmp/pr-body.md \
              --label "upstream-sync")
          else
            gh pr edit "$PR_URL" --body-file .sync-tmp/pr-body.md
          fi
          gh pr edit "$PR_URL" --add-assignee "${{ github.repository_owner }}" || true
          gh pr edit "$PR_URL" --add-reviewer "${{ github.repository_owner }}" || true

          node scripts/notify-feishu.mjs \
            --status ready \
            --title "DeskPal 上游更新同步就绪 · $NEW_TAG" \
            --body "自动三方合并 **0 冲突**，且 \`tsc --noEmit && vite build\` 全部通过 ✅\n\n- 适配客户端版本：\`$COMPAT_VER\`\n- 自动同步文件数：${{ steps.sync.outputs.merged_count }}\n- 合并 PR 后将自动打包发布新版 Release。" \
            --url "$PR_URL" \
            --button "打开 PR 并合并"

      - name: Case B — Open Draft PR & Notify Feishu (Red) on Conflict or Build Failure
        if: ${{ inputs.test_feishu != true && steps.sync.outputs.has_changes == 'true' && steps.dedup.outputs.skip != 'true' && (steps.sync.outputs.conflict_count != '0' || steps.build.outputs.build_ok != 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.sync.outputs.branch_name }}
          NEW_TAG: ${{ steps.sync.outputs.new_tag }}
          NEW_WEB_COMMIT: ${{ steps.sync.outputs.new_web_commit }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts_list }}
          BUILD_OK: ${{ steps.build.outputs.build_ok }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          {
            cat .sync-tmp/sync-report.md
            echo ""
            echo "### 构建与冲突状态"
            echo "- 合并冲突数：**${{ steps.sync.outputs.conflict_count }}** ${CONFLICTS:+(\`$CONFLICTS\`)}"
            echo "- \`npm run build\` 通过：**$BUILD_OK**"
            echo ""
            echo "### 本地快速处理"
            echo '```bash'
            echo "git fetch origin $BRANCH && git checkout $BRANCH"
            echo "# 解决冲突或适配协议后运行 npm run build 并推送"
            echo '```'
            echo ""
            echo "<details><summary>构建日志 (.sync-tmp/build.log)</summary>"
            echo ""
            echo '```text'
            tail -n 80 .sync-tmp/build.log || true
            echo '```'
            echo "</details>"
            echo ""
            echo "<!-- upstream-web-commit: $NEW_WEB_COMMIT -->"
          } > .sync-tmp/pr-body.md

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "[需适配] sync: DeskPal 上游更新 ($NEW_TAG)" \
              --body-file .sync-tmp/pr-body.md \
              --label "upstream-sync")
          else
            gh pr edit "$PR_URL" --body-file .sync-tmp/pr-body.md
          fi
          gh pr edit "$PR_URL" --add-assignee "${{ github.repository_owner }}" || true

          node scripts/notify-feishu.mjs \
            --status error \
            --title "DeskPal 上游同步存在冲突 · 需手动适配 ($NEW_TAG)" \
            --body "上游 \`DeskPal\` 有新变更，自动三方合并出现冲突或类型报错。\n\n- 同步分支：\`$BRANCH\`\n- 冲突文件：\`${CONFLICTS:-无（仅构建报错）}\`\n- 构建状态：\`$BUILD_OK\`\n- 同一提交后续巡检不会重复打扰，请拉取该分支解决冲突并推送。" \
            --url "$PR_URL" \
            --button "查看草稿 PR"
