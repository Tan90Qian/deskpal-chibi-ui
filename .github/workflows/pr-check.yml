name: PR Verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --no-fund --no-audit

      - name: Typecheck & Build
        run: npm run build

      - name: Notify Feishu When Updated Sync PR Passes Build
        if: ${{ success() && (github.event.action == 'synchronize' || github.event.action == 'ready_for_review') && (startsWith(github.head_ref, 'sync/') || contains(join(github.event.pull_request.labels.*.name, ','), 'upstream-sync')) }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          node scripts/notify-feishu.mjs \
            --status ready \
            --title "DeskPal · 同步 PR #${{ github.event.pull_request.number }} 构建通过，可合并" \
            --body "PR **${{ github.event.pull_request.title }}** 最新提交已通过 \`tsc --noEmit && vite build\` 校验 ✅\n\n- 合并到 \`main\` 后将自动打包发布新版 Release。" \
            --url "${{ github.event.pull_request.html_url }}" \
            --button "打开 PR 并合并"

      - name: Notify Feishu on PR Build Failure
        if: ${{ failure() && !github.event.pull_request.draft && (startsWith(github.head_ref, 'sync/') || contains(join(github.event.pull_request.labels.*.name, ','), 'upstream-sync')) }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          node scripts/notify-feishu.mjs \
            --status error \
            --title "DeskPal · PR #${{ github.event.pull_request.number }} 构建失败" \
            --body "PR **${{ github.event.pull_request.title }}** 未通过 \`tsc --noEmit && vite build\` 校验，请查看日志。" \
            --url "${{ github.event.pull_request.html_url }}" \
            --button "查看 PR" \
            --url2 "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --button2 "查看构建日志"
